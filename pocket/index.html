<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b5a6c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>html{background:#14181b}body{margin:0}</style>
<title>口袋文件</title>
<style>
/* 版面：頂部一條工具列，其餘全是閱讀區；文件只在手機本機解析，不上傳 */
:root{
  --bg:#f3f1ee; --bar:#ffffff; --fg:#1d2428; --muted:#68727a; --line:#d9d5cf;
  --accent:#0f6f78; --accent-fg:#ffffff; --page-shadow:0 1px 3px rgba(20,30,35,.18);
  --paper:#ffffff; --ink:#1d2428; --head:#eef3f4;
  --font:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14181b; --bar:#1e2428; --fg:#e8ecee; --muted:#93a0a8; --line:#2f373c;
  --accent:#4fc1c9; --accent-fg:#0c1417; --page-shadow:0 1px 4px rgba(0,0,0,.6);
  --paper:#1b2125; --ink:#e8ecee; --head:#263036; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181b; --bar:#1e2428; --fg:#e8ecee; --muted:#93a0a8; --line:#2f373c;
  --accent:#4fc1c9; --accent-fg:#0c1417; --page-shadow:0 1px 4px rgba(0,0,0,.6);
  --paper:#1b2125; --ink:#e8ecee; --head:#263036; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:10}
.bar{display:flex;align-items:center;gap:8px;background:var(--bar);border-bottom:1px solid var(--line);
  padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));flex:none}
.bar .name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.bar .name small{display:block;font-weight:400;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--bar);color:var(--fg);border-radius:8px;min-width:44px;height:44px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
button:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
#zoomval{min-width:48px;font-variant-numeric:tabular-nums;color:var(--muted);text-align:center;font-size:13px}
#viewer{flex:1;min-height:0;overflow:auto;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;
  padding-block:12px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
#pages{display:flex;flex-direction:column;align-items:center;gap:12px;width:max-content;min-width:100%}
.page{background:#fff;box-shadow:var(--page-shadow);position:relative;flex:none}
.page canvas{display:block}
.page .n{position:absolute;right:6px;bottom:4px;font-size:11px;color:#6a747a;background:rgba(255,255,255,.8);border-radius:4px;padding:0 5px}
#empty{margin:auto;max-width:360px;padding:24px 4px}
#empty h1{font-size:22px;margin:0 0 8px;text-wrap:balance}
#empty p{color:var(--muted);margin:0 0 20px;line-height:1.6}
#empty ul{color:var(--muted);line-height:1.8;padding-left:1.2em;margin:20px 0 0;font-size:13px}
#msg{color:var(--accent);margin-top:12px;min-height:1.4em}
#drop{outline:3px dashed var(--accent);outline-offset:-8px}

/* Office 文件檢視 */
#doc{background:var(--paper);color:var(--ink);box-shadow:var(--page-shadow);border-radius:6px;padding:16px;font-size:16px;line-height:1.7;min-width:0;max-width:820px;margin:0 auto;overflow-wrap:anywhere}
#doc img{max-width:100%;height:auto}
#doc h1,#doc h2,#doc h3{line-height:1.3;text-wrap:balance}
#doc table{border-collapse:collapse;font-size:.9em}
#doc td,#doc th{border:1px solid var(--line);padding:4px 8px;vertical-align:top;overflow-wrap:normal;white-space:pre-wrap}
#doc th{background:var(--head)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;padding-bottom:4px}
.tabs button{height:36px;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.sheetbox{overflow:auto;max-width:100%}
.slide{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 14px;background:var(--paper)}
.slide .sn{font-size:12px;color:var(--muted);margin-bottom:6px}
.slide p{margin:.25em 0}
.note{color:var(--muted);font-size:13px;margin:0 0 12px}
pre.txt{white-space:pre-wrap;margin:0;font-family:inherit}
@media (prefers-reduced-motion:no-preference){button{transition:background .15s}}
</style>
</head>
<body>


<div class="bar">
  <label class="btn primary" for="file" tabindex="0" id="openbtn">開啟</label>
  <input type="file" id="file" accept=".pdf,.docx,.xlsx,.xls,.csv,.pptx,.txt,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.openxmlformats-officedocument.presentationml.presentation" hidden>
  <div class="name" id="name">口袋文件<small id="pg">還沒開啟檔案</small></div>
  <button id="zout" aria-label="縮小">−</button>
  <span id="zoomval">適寬</span>
  <button id="zin" aria-label="放大">＋</button>
</div>

<div id="viewer">
  <div id="empty">
    <h1>點一下，開手機裡的文件</h1>
    <p>PDF、Word、Excel、PowerPoint、CSV、文字檔都能看。檔案只在這支手機上讀，不會上傳到任何地方。</p>
    <label class="btn primary" for="file" style="width:100%">選擇檔案</label>
    <div id="msg" role="status"></div>
    <ul>
      <li>PDF：上下滑翻頁，兩指縮放，下次回到上次的頁數</li>
      <li>Word：顯示文字、標題、表格、圖片，版面是重排後的閱讀版</li>
      <li>Excel：每個工作表一個分頁鈕，顯示儲存格的值</li>
      <li>PowerPoint：每張投影片顯示文字與圖片，不含動畫與原版面</li>
      <li>舊格式 .doc、.ppt 打不開，請在原軟體另存成 .docx、.pptx</li>
    </ul>
  </div>
  <div id="pages" hidden></div>
  <div id="doc" hidden></div>
</div>

<script src="lib/pdf.min.js"></script>
<script src="lib/jszip.min.js"></script>
<script src="lib/mammoth.browser.min.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<script>
(function(){
  var lib = window.pdfjsLib; if(lib)lib.GlobalWorkerOptions.workerSrc=new URL("lib/pdf.worker.min.js",location.href).href;
  var $ = function(id){return document.getElementById(id)};
  var viewer=$('viewer'), pagesEl=$('pages'), docEl=$('doc'), empty=$('empty');
  var mode='', pdf=null, zoom=1, key='', cells=[], ratio=1.414, rendering={};
  var DPR=Math.min(window.devicePixelRatio||1,2.5);

  function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
  function say(t){$('msg').textContent=t||''}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

  function show(m,name){
    mode=m; empty.hidden=true; pagesEl.hidden=(m!=='pdf'); docEl.hidden=(m==='pdf');
    $('name').firstChild.nodeValue=name; zoom=1; setLabel(); viewer.scrollTop=0;
  }
  function setLabel(){ $('zoomval').textContent = zoom===1 ? '適寬' : Math.round(zoom*100)+'%' }
  function fail(t){ if(mode){$('pg').textContent=t} say(t) }

  function ext(n){var m=/\.([a-z0-9]+)$/i.exec(n||'');return m?m[1].toLowerCase():''}

  function open(file){
    if(!file)return;
    var e=ext(file.name);
    if(e==='doc'||e==='ppt'){say('舊格式 .'+e+' 打不開，請在原軟體另存成 .'+e+'x');return}
    say('讀取中…');
    var fr=new FileReader();
    fr.onerror=function(){say('讀不到這個檔案，請再選一次')};
    fr.onload=function(){
      var buf=fr.result;
      try{
        if(e==='pdf')openPdf(buf,file);
        else if(e==='docx')openDocx(buf,file);
        else if(e==='xlsx'||e==='xls'||e==='csv')openSheet(buf,file,e);
        else if(e==='pptx')openPptx(buf,file);
        else if(e==='txt')openTxt(buf,file);
        else say('這種檔案還看不了：.'+e);
      }catch(err){say('這個檔案打不開')}
    };
    fr.readAsArrayBuffer(file);
  }

  /* ---------- PDF ---------- */
  function fitWidth(){var cs=getComputedStyle(viewer);return Math.max(200,viewer.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight))}

  function openPdf(buf,file){
    if(!lib){say('PDF 引擎沒載入，請確認網路後重新整理');return}
    lib.getDocument({data:new Uint8Array(buf)}).promise.then(function(doc){
      pdf=doc; key='pos:'+file.name+':'+file.size;
      show('pdf',file.name); build();
    }).catch(function(err){
      say(err&&err.name==='PasswordException'?'這份 PDF 有密碼，目前還不能開':'這個檔案打不開，確認它是 PDF');
    });
  }

  function build(){
    pagesEl.innerHTML=''; cells=[]; rendering={};
    pdf.getPage(1).then(function(p){
      var v=p.getViewport({scale:1}); ratio=v.height/v.width;
      for(var i=1;i<=pdf.numPages;i++){
        var d=document.createElement('div'); d.className='page'; d.dataset.n=i;
        var n=document.createElement('span'); n.className='n'; n.textContent=i; d.appendChild(n);
        pagesEl.appendChild(d); cells.push(d);
      }
      layout();
      visCheck();
      var last=parseInt(store(key),10);
      if(last>1&&last<=pdf.numPages){setTimeout(function(){cells[last-1].scrollIntoView()},50)}
      status();
    });
  }

  function layout(){
    var w=Math.round(fitWidth()*zoom);
    cells.forEach(function(c){
      c.style.width=w+'px'; c.style.height=Math.round(w*(c._ratio||ratio))+'px';
      var cv=c.querySelector('canvas'); if(cv)cv.remove(); c._done=false;
    });
    setLabel();
    cells.forEach(function(c){c._vis=false});
    visCheck();
  }

  function visCheck(){
    if(mode!=='pdf')return;
    var vr=viewer.getBoundingClientRect(), lo=vr.top-1400, hi=vr.bottom+1400;
    cells.forEach(function(c){
      var r=c.getBoundingClientRect(), v=r.bottom>lo&&r.top<hi;
      if(v){c._vis=true;draw(c)}
      else if(c._vis){c._vis=false;var cv=c.querySelector('canvas'); if(cv){cv.width=cv.height=0;cv.remove();c._done=false}}
    });
  }

  function draw(c){
    if(c._done||rendering[c.dataset.n])return;
    var n=+c.dataset.n, w=parseFloat(c.style.width); rendering[n]=true;
    pdf.getPage(n).then(function(p){
      var v1=p.getViewport({scale:1}), s=w/v1.width, v=p.getViewport({scale:s*DPR});
      c._ratio=v1.height/v1.width;
      var cv=document.createElement('canvas'); cv.width=Math.floor(v.width); cv.height=Math.floor(v.height);
      cv.style.width=w+'px'; cv.style.height=(w*c._ratio)+'px';
      c.style.height=(w*c._ratio)+'px';
      return p.render({canvasContext:cv.getContext('2d'),viewport:v}).promise.then(function(){
        var old=c.querySelector('canvas'); if(old)old.remove();
        c.insertBefore(cv,c.firstChild); c._done=true;
      });
    }).catch(function(){}).then(function(){rendering[n]=false});
  }

  function curPage(){
    var top=viewer.getBoundingClientRect().top+viewer.clientHeight*0.3, best=1;
    for(var i=0;i<cells.length;i++){var r=cells[i].getBoundingClientRect(); if(r.top<=top)best=i+1; else break}
    return best;
  }
  function status(){
    if(mode!=='pdf'||!pdf)return; var p=curPage();
    $('pg').textContent='PDF｜第 '+p+' / '+pdf.numPages+' 頁';
    store(key,String(p));
  }
  var t=null,raf=0; viewer.addEventListener('scroll',function(){clearTimeout(t);t=setTimeout(status,120);if(!raf)raf=setTimeout(function(){raf=0;visCheck()},100)},{passive:true});

  /* ---------- Word ---------- */
  function openDocx(buf,file){
    if(!window.mammoth){say('Word 引擎沒載入，請確認網路後重新整理');return}
    mammoth.convertToHtml({arrayBuffer:buf}).then(function(r){
      show('doc',file.name); $('pg').textContent='Word｜閱讀版';
      docEl.innerHTML=r.value||'<p class="note">這份文件沒有可顯示的內容。</p>';
    }).catch(function(){say('這個 Word 檔打不開，確認它是 .docx')});
  }

  /* ---------- Excel / CSV ---------- */
  function openSheet(buf,file,e){
    if(!window.XLSX){say('Excel 引擎沒載入，請確認網路後重新整理');return}
    var wb=e==='csv'?XLSX.read(new TextDecoder('utf-8').decode(buf),{type:'string'}):XLSX.read(buf,{type:'array'});
    show('doc',file.name); $('pg').textContent='Excel｜'+wb.SheetNames.length+' 個工作表';
    docEl.innerHTML='<div class="tabs" id="tabs"></div><div class="sheetbox" id="sheetbox"></div>';
    var tabs=$('tabs'), box=$('sheetbox');
    function pick(i){
      Array.prototype.forEach.call(tabs.children,function(b,j){b.setAttribute('aria-pressed',j===i?'true':'false')});
      var ws=wb.Sheets[wb.SheetNames[i]], range=XLSX.utils.decode_range(ws['!ref']||'A1:A1'), cut='';
      if(range.e.r>1999){range.e.r=1999;ws['!ref']=XLSX.utils.encode_range(range);cut='<p class="note">資料很多，只顯示前 2000 列。</p>'}
      box.innerHTML=cut+XLSX.utils.sheet_to_html(ws);
    }
    wb.SheetNames.forEach(function(n,i){
      var b=document.createElement('button'); b.textContent=n; b.onclick=function(){pick(i)}; tabs.appendChild(b);
    });
    pick(0);
  }

  /* ---------- PowerPoint（簡化：文字＋圖片） ---------- */
  function openPptx(buf,file){
    if(!window.JSZip){say('簡報引擎沒載入，請確認網路後重新整理');return}
    JSZip.loadAsync(buf).then(function(zip){
      var names=Object.keys(zip.files).filter(function(n){return /^ppt\/slides\/slide\d+\.xml$/.test(n)})
        .sort(function(a,b){return parseInt(a.match(/(\d+)\.xml/)[1])-parseInt(b.match(/(\d+)\.xml/)[1])});
      show('doc',file.name); $('pg').textContent='PowerPoint｜'+names.length+' 張投影片';
      docEl.innerHTML='<p class="note">簡化檢視：顯示每張投影片的文字與圖片，不含原本的版面與動畫。</p>';
      var chain=Promise.resolve();
      names.forEach(function(n,idx){
        chain=chain.then(function(){return slide(zip,n,idx+1)});
      });
    }).catch(function(){say('這個簡報打不開，確認它是 .pptx')});
  }
  function slide(zip,name,num){
    var relName=name.replace('slides/','slides/_rels/')+'.rels';
    return Promise.all([zip.file(name).async('string'), zip.file(relName)?zip.file(relName).async('string'):Promise.resolve('')]).then(function(r){
      var xml=new DOMParser().parseFromString(r[0],'application/xml');
      var rels={}; if(r[1]){var rx=new DOMParser().parseFromString(r[1],'application/xml');
        Array.prototype.forEach.call(rx.getElementsByTagName('Relationship'),function(e){rels[e.getAttribute('Id')]=e.getAttribute('Target')})}
      var box=document.createElement('div'); box.className='slide';
      var html='<div class="sn">第 '+num+' 張</div>';
      Array.prototype.forEach.call(xml.getElementsByTagName('a:p'),function(p){
        var s=''; Array.prototype.forEach.call(p.getElementsByTagName('a:t'),function(t){s+=t.textContent});
        if(s.trim())html+='<p>'+esc(s)+'</p>';
      });
      box.innerHTML=html; docEl.appendChild(box);
      var ids=[]; Array.prototype.forEach.call(xml.getElementsByTagName('a:blip'),function(b){var id=b.getAttribute('r:embed');if(id)ids.push(id)});
      return Promise.all(ids.map(function(id){
        var tg=rels[id]; if(!tg)return null;
        var path='ppt/'+tg.replace(/^\.\.\//,''); var f=zip.file(path); if(!f)return null;
        return f.async('base64').then(function(b64){
          var e=ext(path), mime=e==='png'?'image/png':e==='gif'?'image/gif':(e==='jpg'||e==='jpeg')?'image/jpeg':null; if(!mime)return null;
          var im=new Image(); im.src='data:'+mime+';base64,'+b64; box.appendChild(im);
        });
      }));
    });
  }

  /* ---------- 文字檔 ---------- */
  function openTxt(buf,file){
    show('doc',file.name); $('pg').textContent='文字檔';
    docEl.innerHTML='<pre class="txt">'+esc(new TextDecoder('utf-8').decode(buf))+'</pre>';
  }

  /* ---------- 縮放 ---------- */
  function setZoom(z){
    if(!mode)return; zoom=Math.min(4,Math.max(.5,z));
    if(mode==='pdf'){var p=curPage(); layout(); cells[p-1].scrollIntoView()}
    else{docEl.style.fontSize=(16*zoom)+'px'; setLabel()}
  }
  $('zin').onclick=function(){setZoom(zoom*1.25)};
  $('zout').onclick=function(){setZoom(zoom/1.25)};
  $('zoomval').onclick=function(){setZoom(1)};

  var d0=0,lastD=0;
  function dist(e){var a=e.touches[0],b=e.touches[1];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}
  viewer.addEventListener('touchstart',function(e){if(e.touches.length===2){d0=dist(e);lastD=0}},{passive:true});
  viewer.addEventListener('touchmove',function(e){if(e.touches.length===2&&d0){lastD=dist(e);e.preventDefault()}},{passive:false});
  viewer.addEventListener('touchend',function(e){
    if(e.touches.length===0){
      if(d0&&lastD){var r=lastD/d0; if(Math.abs(r-1)>.08)setZoom(zoom*r)}
      d0=0;lastD=0;
    }
  },{passive:true});


  /* ---------- 從別的 App 分享進來／桌面「開啟檔案」 ---------- */
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
  if(/[?&]shared=1/.test(location.search) && window.caches){
    caches.open('share').then(function(c){return c.match('shared-file').then(function(r){
      if(!r)return; var nm=decodeURIComponent(r.headers.get('X-Name')||'shared');
      return r.blob().then(function(b){open(new File([b],nm,{type:b.type})); return c.delete('shared-file')});
    })}).then(function(){history.replaceState(null,'',location.pathname)}).catch(function(){});
  }
  if('launchQueue' in window){window.launchQueue.setConsumer(function(p){
    if(p.files&&p.files.length)p.files[0].getFile().then(open)})}
  $('file').addEventListener('change',function(e){open(e.target.files[0]);e.target.value=''});
  $('openbtn').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click()}});
  ['dragover','dragenter'].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault();document.body.id='drop'})});
  document.addEventListener('dragleave',function(){document.body.id=''});
  document.addEventListener('drop',function(e){e.preventDefault();document.body.id='';var f=e.dataTransfer&&e.dataTransfer.files[0];if(f)open(f)});
  window.addEventListener('resize',function(){if(mode==='pdf'){clearTimeout(window._rt);window._rt=setTimeout(layout,200)}});
})();
</script>
</body>
</html>
