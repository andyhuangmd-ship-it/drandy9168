<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=760">
<meta name="robots" content="noindex,nofollow">
<title>drandy9168 後台</title>
<style>
:root{--bg:#f4efe9;--card:#fff;--ink:#1c1c1e;--ink2:#5f5f66;--muted:#8a8a90;--line:#e6e0d8;--grid:#eee9e2;
--brand:#da7d5e;--navy:#374561;--navy-soft:rgba(55,69,97,.10);--bar:#c9d0dc;--ok:#2e7d32;--warn:#b3261e}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}
header{background:var(--brand);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header strong{font-size:20px}
header nav{display:flex;gap:6px;margin-left:auto}
header nav button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.7);padding:4px 14px;border-radius:999px;cursor:pointer;font:inherit}
header nav button.on{background:#fff;color:var(--brand);border-color:#fff;font-weight:700}
main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:18px}
input,textarea,button,select{font:inherit}
input,textarea{width:100%;padding:8px;border:1px solid #ccc;border-radius:6px}
.btn{padding:6px 14px;border:0;border-radius:6px;background:var(--navy);color:#fff;cursor:pointer;margin:4px 6px 0 0}
.btn.warn{background:var(--warn)}.btn.ok{background:var(--ok)}.btn.alt{background:var(--brand)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}
#login{max-width:360px;margin:48px auto}
#loginMsg{color:var(--warn);min-height:1.5em;margin:6px 0 0}
/* 總覽（學 Blogger：所有時間／今天／昨天／本月／上個月） */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:0}
.kpi{padding:4px 12px;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0}
.kpi span{display:block;color:var(--ink2);font-size:14px}
.kpi b{font-size:24px;font-variant-numeric:tabular-nums}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.toolbar select{padding:6px 10px;border:1px solid #ccc;border-radius:6px;background:#fff}
.toolbar .sum{margin-left:auto;color:var(--ink2)}
.toolbar .sum b{color:var(--ink);font-size:20px;font-variant-numeric:tabular-nums}
.chart-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 6px;color:var(--ink2);font-size:14px}
.chart-title strong{color:var(--ink);font-size:16px}
#chart{position:relative;width:100%}
#chart svg{display:block;width:100%;height:240px;touch-action:pan-y}
#tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.12);white-space:nowrap;display:none}
#tip b{font-size:15px}
.note{color:var(--muted);font-size:13px;margin:6px 0 0}
/* 排行清單：標題＋細橫條＋數字 */
.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:8px 4px;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.rows li.click{cursor:pointer}
.rows li.click:hover{background:#faf6f1}
.rows li.sel{background:#f3ece4}
.rows .rk{color:var(--muted);font-size:13px;text-align:right}
.rows .nm{min-width:0}
.rows .nm div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows .nm a{color:var(--muted);font-size:12px;margin-left:6px;text-decoration:none}
.rows .track{height:4px;margin-top:4px}
.rows .bar{height:4px;border-radius:0 4px 4px 0;background:var(--bar)}
.rows li.sel .bar{background:var(--navy)}
.rows .n{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;min-width:3.5em}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cols .card{margin-bottom:0}
/* 留言管理（沿用原功能） */
.tabs button{background:#fff;color:var(--navy);border:1px solid var(--navy);border-radius:6px;padding:4px 12px;margin:0 6px 6px 0;cursor:pointer}
.tabs button.on{background:var(--navy);color:#fff}
.meta{color:#666;font-size:13px}.meta a{color:var(--navy)}
.text{white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0}
.st{display:inline-block;padding:0 6px;font-size:12px;color:#fff;background:#888;border-radius:3px}
.st.pending{background:var(--brand)}.st.published{background:var(--ok)}
#msg{min-height:1.5em}
@media (max-width:700px){
  .kpis{grid-template-columns:repeat(2,1fr);gap:8px}
  .kpi{border-left:0;padding:4px 0}
  .kpi:first-child{grid-column:1/-1}
  .cols{grid-template-columns:1fr}
  .toolbar .sum{margin-left:0;width:100%}
}
</style>
</head>
<body>
<header><strong>drandy9168 後台</strong>
<nav id="nav" hidden><button data-p="stats" class="on">統計資料</button><button data-p="cmts">留言</button><button data-p="out">登出</button></nav>
</header>
<main>
<div class="card" id="login">
<h2>登入</h2>
<label>密碼<input type="password" id="token" autocomplete="current-password" inputmode="numeric"></label>
<button class="btn" id="go">登入</button>
<p id="loginMsg" role="alert"></p>
</div>

<section id="stats" hidden>
<div class="card"><div class="kpis" id="kpis"></div></div>

<div class="card">
<div class="toolbar">
<select id="range" aria-label="時間範圍">
<option value="today" selected>今天</option><option value="yday">昨天</option><option value="7d">最近 7 天</option>
<option value="30d">最近 30 天</option><option value="month">本月</option><option value="lastmonth">上個月</option>
<option value="3m">最近 3 個月</option><option value="12m">最近 12 個月</option><option value="all">所有時間</option>
</select>
<button class="btn ghost" id="reload" title="重新整理">↻ 重新整理</button>
<span class="sum" id="rangeSum"></span>
</div>
<div class="chart-title"><strong id="chartName">全站</strong><span>每日觀看次數</span><button class="btn ghost" id="allSite" hidden>看全站</button></div>
<div id="chart"><svg id="svg" role="img" aria-label="每日觀看次數折線圖"></svg><div id="tip"></div></div>
<p class="note" id="dailyNote"></p>
</div>

<div class="card">
<h2>熱門文章</h2>
<p class="note" style="margin:-6px 0 8px">點一篇，上面的圖就換成那一篇的每日觀看。</p>
<ul class="rows" id="posts"></ul>
</div>

<div class="cols">
<div class="card"><h2>熱門參照網址</h2><ul class="rows" id="refs"></ul><p class="note" id="srcNote"></p></div>
<div class="card"><h2>作業系統</h2><ul class="rows" id="oses"></ul></div>
</div>
</section>

<section id="cmts" hidden>
<div class="tabs">
<button data-st="all" class="on">全部</button><button data-st="published">已公開</button><button data-st="pending">待審核</button><button data-st="hidden">已隱藏</button>
</div>
<p id="msg" role="status"></p>
<div id="list"></div>
</section>
</main>
<script>
(function () {
  "use strict";
  var API = window.DRANDY_API || (/drandy9168\.com$/.test(location.hostname) ? "https://api.drandy9168.com/api" : "/api");
  var token = "", status = "all", data = null, titles = {}, focus = null;
  try { token = sessionStorage.getItem("adm") || ""; } catch (e) {}
  var $ = function (s) { return document.querySelector(s); };
  var fmt = function (n) { return Number(n || 0).toLocaleString("zh-TW"); };
  var WEEK = "日一二三四五六";

  function call(method, path, body) {
    return fetch(API + "/admin" + path, {
      method: method,
      headers: Object.assign({ Authorization: "Bearer " + token }, body ? { "Content-Type": "application/json" } : {}),
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) { var e = new Error(j.error || ("HTTP " + r.status)); e.status = r.status; throw e; }
        return j;
      });
    });
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // ---------- 日期（一律用台北日期字串 YYYY-MM-DD） ----------
  function addDays(d, n) {
    var t = new Date(Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10)) + n * 86400000);
    return t.toISOString().slice(0, 10);
  }
  function md(d) { return +d.slice(5, 7) + "/" + +d.slice(8, 10); }
  function wk(d) { return WEEK[new Date(d + "T00:00:00Z").getUTCDay()]; }

  function rangeOf(key, t) {
    var m1 = t.slice(0, 8) + "01";
    switch (key) {
      case "today": return [t, t];
      case "yday": return [addDays(t, -1), addDays(t, -1)];
      case "7d": return [addDays(t, -6), t];
      case "30d": return [addDays(t, -29), t];
      case "month": return [m1, t];
      case "lastmonth": var e = addDays(m1, -1); return [e.slice(0, 8) + "01", e];
      case "3m": return [addDays(t, -89), t];
      case "12m": return [addDays(t, -364), t];
      default: return null;   // 所有時間
    }
  }
  var inR = function (d, r) { return !r || (d >= r[0] && d <= r[1]); };

  function sumDaily(r, slug) {
    var n = 0;
    data.daily.forEach(function (x) { if ((!slug || x[0] === slug) && inR(x[1], r)) n += x[2]; });
    return n;
  }
  function allTime(slug) {
    if (slug) return data.total[slug] || 0;
    var n = 0; for (var k in data.total) n += data.total[k]; return n;
  }
  // 「所有時間」用總計表（含每日紀錄開始前的觀看），其他區間用每日表
  function viewsIn(r, slug) { return r ? sumDaily(r, slug) : allTime(slug); }
  function title(s) { return titles[s] || s; }

  // ---------- 畫面 ----------
  function renderKpis() {
    var t = data.today, box = $("#kpis");
    box.textContent = "";
    [["所有時間", null], ["今天", "today"], ["昨天", "yday"], ["本月", "month"], ["上個月", "lastmonth"]].forEach(function (k) {
      var d = el("div", "kpi");
      d.appendChild(el("span", null, k[0]));
      d.appendChild(el("b", null, fmt(viewsIn(k[1] && rangeOf(k[1], t)))));
      box.appendChild(d);
    });
  }

  function listRows(ul, items, onClick) {
    ul.textContent = "";
    var max = items.reduce(function (m, x) { return Math.max(m, x.n); }, 0) || 1;
    if (!items.length) { var li = el("li"); li.appendChild(el("span")); li.appendChild(el("span", "note", "這段時間沒有資料")); ul.appendChild(li); return; }
    items.forEach(function (x, i) {
      var li = el("li", onClick ? "click" + (focus === x.key ? " sel" : "") : "");
      li.appendChild(el("span", "rk", String(i + 1)));
      var nm = el("div", "nm"), line = el("div", null, x.label);
      if (x.href) {
        var a = el("a", null, "開啟↗"); a.href = x.href; a.target = "_blank"; a.rel = "noopener";
        a.addEventListener("click", function (e) { e.stopPropagation(); });
        line.appendChild(a);
      }
      nm.appendChild(line);
      var track = el("div", "track"), bar = el("div", "bar");
      bar.style.width = Math.max(1, Math.round(100 * x.n / max)) + "%";
      track.appendChild(bar); nm.appendChild(track);
      li.appendChild(nm);
      li.appendChild(el("span", "n", fmt(x.n)));
      if (onClick) li.addEventListener("click", function () { onClick(x.key); });
      ul.appendChild(li);
    });
  }

  function renderPosts(r) {
    var slugs = {};
    for (var k in data.total) slugs[k] = 1;
    for (k in titles) slugs[k] = 1;
    var items = Object.keys(slugs).map(function (s) {
      return { key: s, label: title(s), n: viewsIn(r, s), href: "./" + s + ".html" };
    }).filter(function (x) { return x.n > 0; }).sort(function (a, b) { return b.n - a.n; });
    listRows($("#posts"), items, function (s) { focus = focus === s ? null : s; render(); });
  }

  function renderSrc(r) {
    var agg = { ref: {}, os: {} };
    data.src.forEach(function (x) {
      if (inR(x[0], r)) agg[x[1]][x[2]] = (agg[x[1]][x[2]] || 0) + x[3];
    });
    function top(o, n) {
      var a = Object.keys(o).map(function (k) { return { key: k, label: k, n: o[k] }; }).sort(function (a, b) { return b.n - a.n; });
      if (a.length > n) {
        var rest = a.slice(n - 1).reduce(function (s, x) { return s + x.n; }, 0);
        a = a.slice(0, n - 1).concat([{ key: "其他", label: "其他（" + (a.length - n + 1) + " 個網站）", n: rest }]);
      }
      return a;
    }
    listRows($("#refs"), top(agg.ref, 10));
    listRows($("#oses"), top(agg.os, 8));
    var first = data.src.length ? data.src[0][0] : data.today;
    $("#srcNote").textContent = "參照網址與作業系統從 " + first.replace(/-/g, "/") + " 開始記錄；只記網域，不記個人資料。";
  }

  function renderChart(r) {
    var t = data.today, from, to;
    if (r) { from = r[0]; to = r[1]; }
    else { from = data.daily.length ? data.daily[0][1] : t; to = t; }
    if (addDays(to, -6) < from) from = addDays(to, -6);   // 今天／昨天這種一天的範圍，圖至少畫一週
    var byDay = {};
    data.daily.forEach(function (x) { if (!focus || x[0] === focus) byDay[x[1]] = (byDay[x[1]] || 0) + x[2]; });
    var days = [];
    for (var d = from; d <= to; d = addDays(d, 1)) days.push(d);
    var vals = days.map(function (d) { return byDay[d] || 0; });

    var box = $("#chart"), svg = $("#svg"), tip = $("#tip");
    var W = box.clientWidth || 600, H = 240, L = 44, R = 12, T = 12, B = 28;
    var max = Math.max.apply(null, vals.concat([4]));
    var step = Math.pow(10, Math.floor(Math.log10(max / 4)));
    [1, 2, 2.5, 5, 10].some(function (m) { if (step * m * 4 >= max) { step *= m; return true; } });
    var top = step * 4;
    var x = function (i) { return days.length < 2 ? L : L + i * (W - L - R) / (days.length - 1); };
    var y = function (v) { return T + (H - T - B) * (1 - v / top); };
    var NS = "http://www.w3.org/2000/svg";
    function s(tag, at, txt) {
      var e = document.createElementNS(NS, tag);
      for (var k in at) e.setAttribute(k, at[k]);
      if (txt != null) e.textContent = txt;
      svg.appendChild(e); return e;
    }
    svg.textContent = "";
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    for (var g = 0; g <= 4; g++) {
      var gy = y(step * g);
      s("line", { x1: L, x2: W - R, y1: gy, y2: gy, stroke: g ? "var(--grid)" : "var(--line)", "stroke-width": 1 });
      s("text", { x: L - 6, y: gy + 4, "text-anchor": "end", "font-size": 12, fill: "var(--muted)" }, fmt(step * g));
    }
    var nt = Math.min(6, days.length);
    for (var i = 0; i < nt; i++) {
      var idx = nt < 2 ? 0 : Math.round(i * (days.length - 1) / (nt - 1));
      s("text", { x: x(idx), y: H - 8, "text-anchor": i === 0 ? "start" : i === nt - 1 ? "end" : "middle", "font-size": 12, fill: "var(--muted)" }, md(days[idx]));
    }
    var pts = vals.map(function (v, i) { return x(i).toFixed(1) + "," + y(v).toFixed(1); });
    s("path", { d: "M" + x(0) + "," + y(0) + "L" + pts.join("L") + "L" + x(vals.length - 1) + "," + y(0) + "Z", fill: "var(--navy-soft)" });
    s("path", { d: "M" + pts.join("L"), fill: "none", stroke: "var(--navy)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" });
    if (days.length <= 31) vals.forEach(function (v, i) {
      s("circle", { cx: x(i), cy: y(v), r: 4, fill: "var(--navy)", stroke: "var(--card)", "stroke-width": 2 });
    });
    // 滑鼠／手指移上去：十字線＋數字
    var cross = s("line", { y1: T, y2: H - B, stroke: "var(--muted)", "stroke-width": 1, "stroke-dasharray": "3 3", visibility: "hidden" });
    var dot = s("circle", { r: 5, fill: "var(--navy)", stroke: "var(--card)", "stroke-width": 2, visibility: "hidden" });
    var hit = s("rect", { x: L, y: 0, width: W - L - R, height: H, fill: "transparent" });
    function move(ev) {
      var rect = svg.getBoundingClientRect(), px = (ev.clientX - rect.left) * W / rect.width;
      var i = days.length < 2 ? 0 : Math.max(0, Math.min(days.length - 1, Math.round((px - L) / ((W - L - R) / (days.length - 1)))));
      cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
      dot.setAttribute("cx", x(i)); dot.setAttribute("cy", y(vals[i])); dot.setAttribute("visibility", "visible");
      tip.innerHTML = "";
      tip.appendChild(document.createTextNode(days[i].replace(/-/g, "/") + "（" + wk(days[i]) + "）　"));
      tip.appendChild(el("b", null, fmt(vals[i]) + " 次"));
      tip.style.display = "block";
      var left = x(i) * rect.width / W + 10;
      if (left + tip.offsetWidth > rect.width) left = x(i) * rect.width / W - tip.offsetWidth - 10;
      tip.style.left = left + "px"; tip.style.top = "4px";
    }
    function leave() { cross.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); tip.style.display = "none"; }
    hit.addEventListener("pointermove", move);
    hit.addEventListener("pointerdown", move);
    hit.addEventListener("pointerleave", leave);

    $("#chartName").textContent = focus ? title(focus) : "全站";
    $("#allSite").hidden = !focus;
    var first = data.daily.length ? data.daily[0][1] : t;
    $("#dailyNote").textContent = "每日數字從 " + first.replace(/-/g, "/") + " 開始記錄；在那之前的觀看只算進「所有時間」。同一人 30 分鐘內重看不重複算，搜尋引擎爬蟲不算。";
  }

  function render() {
    var r = rangeOf($("#range").value, data.today);
    renderKpis();
    var lab = $("#range").selectedOptions[0].textContent;
    $("#rangeSum").innerHTML = "";
    $("#rangeSum").appendChild(document.createTextNode((focus ? "這篇" : "全站") + lab + "　"));
    $("#rangeSum").appendChild(el("b", null, fmt(viewsIn(r, focus))));
    $("#rangeSum").appendChild(document.createTextNode(" 次"));
    renderChart(r);
    renderPosts(r);
    renderSrc(r);
  }

  function loadStats() {
    return Promise.all([
      call("GET", "/stats"),
      fetch("assets/titles.json").then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; })
    ]).then(function (res) { data = res[0]; titles = res[1] || {}; render(); });
  }

  // ---------- 留言管理（原功能） ----------
  function btn(label, cls, fn) {
    var b = el("button", "btn " + cls, label);
    b.addEventListener("click", fn);
    return b;
  }
  function act(p) { p.then(loadComments, function (e) { $("#msg").textContent = e.message; }); }

  function row(c) {
    var d = el("div", "card");
    var meta = el("div", "meta");
    meta.appendChild(el("span", "st " + c.status, { published: "已公開", pending: "待審核", hidden: "已隱藏" }[c.status]));
    meta.appendChild(document.createTextNode(" #" + c.id + "　" + new Date(c.created_at * 1000).toLocaleString("zh-TW") + "　"));
    var a = el("a", null, title(c.slug));
    a.href = "./" + c.slug + ".html#c" + c.id;
    a.target = "_blank";
    meta.appendChild(a);
    if (c.parent_id) meta.appendChild(document.createTextNode("（回覆 #" + c.parent_id + "）"));
    d.appendChild(meta);
    d.appendChild(el("strong", null, c.name + (c.is_owner ? "（作者）" : "")));
    d.appendChild(el("div", "text", c.body));
    if (c.status !== "published") d.appendChild(btn("公開", "ok", function () { act(call("POST", "/comments/" + c.id + "/approve")); }));
    if (c.status !== "hidden") d.appendChild(btn("隱藏", "", function () { act(call("POST", "/comments/" + c.id + "/hide")); }));
    d.appendChild(btn("刪除", "warn", function () {
      if (confirm("確定刪除 #" + c.id + "？（連同底下的回覆）")) act(call("DELETE", "/comments/" + c.id));
    }));
    if (!c.is_owner) {
      d.appendChild(btn("以醫師身分回覆", "alt", function () {
        var t = el("textarea"); t.rows = 3;
        var send = btn("送出回覆（同時公開原留言）", "ok", function () {
          if (t.value.trim()) act(call("POST", "/comments/" + c.id + "/reply", { body: t.value }));
        });
        d.appendChild(t); d.appendChild(send); t.focus();
      }));
    }
    return d;
  }

  function loadComments() {
    $("#msg").textContent = "載入中…";
    return call("GET", "/comments?status=" + status).then(function (j) {
      var list = $("#list"); list.textContent = "";
      j.comments.forEach(function (c) { list.appendChild(row(c)); });
      $("#msg").textContent = j.comments.length ? "" : "沒有留言。";
    }, function (e) { $("#msg").textContent = e.message; });
  }

  // ---------- 登入與切換 ----------
  function show(p) {
    [].forEach.call(document.querySelectorAll("#nav button"), function (b) { b.classList.toggle("on", b.getAttribute("data-p") === p); });
    $("#stats").hidden = p !== "stats";
    $("#cmts").hidden = p !== "cmts";
    if (p === "cmts") loadComments();
  }

  function enter() {
    $("#loginMsg").textContent = "登入中…";
    loadStats().then(function () {
      $("#login").hidden = true; $("#nav").hidden = false; show("stats");
      $("#loginMsg").textContent = "";
    }, function (e) {
      $("#login").hidden = false; $("#nav").hidden = true; $("#stats").hidden = true; $("#cmts").hidden = true;
      $("#loginMsg").textContent = e.status === 401 ? "密碼不對，請再試一次" : e.message;
      if (e.status === 401) { token = ""; try { sessionStorage.removeItem("adm"); } catch (x) {} }
    });
  }

  $("#go").addEventListener("click", function () {
    token = $("#token").value.trim();
    try { sessionStorage.setItem("adm", token); } catch (e) {}
    enter();
  });
  $("#token").addEventListener("keydown", function (e) { if (e.key === "Enter") $("#go").click(); });
  [].forEach.call(document.querySelectorAll("#nav button"), function (b) {
    b.addEventListener("click", function () {
      var p = b.getAttribute("data-p");
      if (p === "out") {
        token = ""; try { sessionStorage.removeItem("adm"); } catch (e) {}
        location.reload(); return;
      }
      show(p);
    });
  });
  [].forEach.call(document.querySelectorAll(".tabs button"), function (b) {
    b.addEventListener("click", function () {
      [].forEach.call(document.querySelectorAll(".tabs button"), function (x) { x.classList.toggle("on", x === b); });
      status = b.getAttribute("data-st"); loadComments();
    });
  });
  $("#range").addEventListener("change", render);
  $("#reload").addEventListener("click", function () { loadStats().catch(function (e) { alert(e.message); }); });
  $("#allSite").addEventListener("click", function () { focus = null; render(); });
  var rt; window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { if (data) render(); }, 150); });
  if (token) enter();
})();
</script>
</body>
</html>
